# Config de test: H2 en memoria en vez de Supabase real. Sobreescribe
# src/main/resources/application.properties (el classpath de test tiene prioridad).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Sin spring.jpa.properties.hibernate.dialect: Hibernate 6 autodetecta el de H2 solo.

app.cors.allowed-origins=http://localhost:5173

# HS256 requiere al menos 256 bits (32 chars); este valor es solo para tests.
jwt.secret=clave-secreta-de-test-1234567890-abcdefghijk
jwt.expiration-ms=3600000

# JavaMailSender se mockea con @MockBean en los tests que disparan un OTP por email,
# pero el bean igual necesita poder construirse al levantar el contexto.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
