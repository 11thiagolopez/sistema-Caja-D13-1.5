# Perfil "demo": corre el sistema completo sin Supabase/AFIP reales, con una base H2 en memoria
# que se recrea y se puebla con datos 100% inventados (ver sql/demo-data.sql) cada vez que arranca.
# Pensado para mostrar el sistema (capturas, demo online, probarlo local) sin tocar nunca datos
# reales de un negocio ni ningún secreto real.
#
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=demo
#
# Usuarios de demo (ver sql/demo-data.sql): admin/demo1234 (ADMIN), vendedor/demo1234 (VENDEDOR).

spring.datasource.url=jdbc:h2:mem:demodb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Corre sql/demo-data.sql recién después de que Hibernate termine de crear el esquema.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/demo-data.sql

server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT: secreto de demo, nunca usar este valor en un entorno real.
jwt.secret=${JWT_SECRET:demo-secreto-no-usar-en-produccion-0000000000}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Sin API key real: EmailService queda efectivamente deshabilitado (loggea el intento y sigue),
# no hace falta ninguna cuenta de Resend para la demo.
resend.api-key=${RESEND_API_KEY:}
resend.remitente=${RESEND_REMITENTE:demo@example.com}

# Sin claves VAPID: Web Push queda desactivado, el resto del sistema funciona igual.
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.contacto=${VAPID_CONTACTO:mailto:demo@example.com}

cotizacion.dolar.api-primaria=${COTIZACION_API_PRIMARIA:https://dolarapi.com/v1/dolares/oficial}
cotizacion.dolar.api-secundaria=${COTIZACION_API_SECUNDARIA:https://dolar-bna.vercel.app/api/cotizacion}
cotizacion.dolar.timeout-ms=${COTIZACION_TIMEOUT_MS:5000}

# AFIP/ARCA: CUIT de ejemplo genérico (no es el de ningún negocio real) y sin certificado →
# la facturación fiscal queda deshabilitada de hecho en la demo (el resto del sistema funciona
# normal; intentar "Facturar" devuelve error, a propósito, para no poder nunca pegarle a ARCA real
# desde este perfil).
afip.cuit=${AFIP_CUIT:20111111112}
afip.punto-venta=${AFIP_PUNTO_VENTA:1}
afip.cert.key-base64=
afip.cert.key-path=
afip.cert.crt-base64=
afip.cert.crt-path=
