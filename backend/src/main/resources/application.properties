spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.jyumiicapspsxgucirjd
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# CORS: origenes permitidos separados por coma (sin espacios). Ajustar al dominio real
# del frontend en producción; el default cubre los puertos típicos de Vite/CRA en local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ==========================================
# ENVIO DE EMAILS (Resend, API HTTPS — no SMTP)
# ==========================================
# Railway bloquea el puerto SMTP saliente (587) en los planes Free/Trial/Hobby, así que un
# JavaMailSender tradicional nunca conecta desde ahí — se manda todo vía la API HTTPS de Resend.
# resend.remitente necesita un dominio propio verificado en Resend para poder mandarle a
# cualquier destinatario (clientes); con onboarding@resend.dev (sin verificar dominio) solo se
# puede mandar a la casilla del dueño de la cuenta de Resend.
resend.api-key=${RESEND_API_KEY:}
resend.remitente=${RESEND_REMITENTE:onboarding@resend.dev}

# ==========================================
# COTIZACION DEL DOLAR (DOLARIZACION DE PRECIOS)
# ==========================================
# APIs publicas gratuitas, sin auth, del dolar oficial VENTA (Banco Nacion). Si la primaria falla
# se prueba la secundaria antes de pedirle al ADMIN que la cargue a mano.
cotizacion.dolar.api-primaria=${COTIZACION_API_PRIMARIA:https://dolarapi.com/v1/dolares/oficial}
cotizacion.dolar.api-secundaria=${COTIZACION_API_SECUNDARIA:https://dolar-bna.vercel.app/api/cotizacion}
cotizacion.dolar.timeout-ms=${COTIZACION_TIMEOUT_MS:5000}

# ==========================================
# FACTURACION FISCAL (ARCA/AFIP - WSFEv1, D13 Monotributo -> siempre Factura C)
# ==========================================
afip.cuit=${AFIP_CUIT:20300238379}
afip.punto-venta=${AFIP_PUNTO_VENTA:4}
# Certificado: en Railway/produccion, cargar el .key/.crt en base64 en estas dos variables. En
# desarrollo local alcanza con apuntar directo a los archivos reales (ver afip.cert.*-path), sin
# tener que basear64 a mano — nunca commitear ninguno de los dos archivos.
afip.cert.key-base64=${AFIP_CERT_KEY_BASE64:}
afip.cert.key-path=${AFIP_CERT_KEY_PATH:}
afip.cert.crt-base64=${AFIP_CERT_CRT_BASE64:}
afip.cert.crt-path=${AFIP_CERT_CRT_PATH:}
