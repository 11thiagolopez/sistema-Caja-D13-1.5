spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.jyumiicapspsxgucirjd
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Sin dialecto fijo: Hibernate 6 lo detecta solo según la base a la que se conecta (PostgreSQL en
# producción, H2 en el perfil demo y en los tests). Fijarlo acá hacía que la demo sobre H2 generara
# SQL de PostgreSQL ("FOR NO KEY UPDATE", "RETURNING") y fallaran las ventas.

server.port=${PORT:8080}

# CORS: origenes permitidos separados por coma (sin espacios). Ajustar al dominio real
# del frontend en producción; el default cubre los puertos típicos de Vite/CRA en local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ==========================================
# ENVIO DE EMAILS (Resend, API HTTPS — no SMTP)
# ==========================================
# Railway bloquea el puerto SMTP saliente (587) en los planes Free/Trial/Hobby, así que un
# JavaMailSender tradicional nunca conecta desde ahí — se manda todo vía la API HTTPS de Resend.
# resend.remitente necesita un dominio propio verificado en Resend para poder mandarle a
# cualquier destinatario (clientes); con onboarding@resend.dev (sin verificar dominio) solo se
# puede mandar a la casilla del dueño de la cuenta de Resend.
resend.api-key=${RESEND_API_KEY:}
resend.remitente=${RESEND_REMITENTE:onboarding@resend.dev}

# ==========================================
# NOTIFICACIONES AL CELULAR (Web Push, ver PushService)
# ==========================================
# Sin las dos claves las notificaciones quedan desactivadas, el resto del sistema anda igual. Nunca
# commitear la privada. Si se cambian, cada dispositivo tiene que volver a activar las notificaciones.
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.contacto=${VAPID_CONTACTO:mailto:admin@example.com}

# ==========================================
# COTIZACION DEL DOLAR (DOLARIZACION DE PRECIOS)
# ==========================================
# APIs publicas gratuitas, sin auth, del dolar oficial VENTA (Banco Nacion). Si la primaria falla
# se prueba la secundaria antes de pedirle al ADMIN que la cargue a mano.
cotizacion.dolar.api-primaria=${COTIZACION_API_PRIMARIA:https://dolarapi.com/v1/dolares/oficial}
cotizacion.dolar.api-secundaria=${COTIZACION_API_SECUNDARIA:https://dolar-bna.vercel.app/api/cotizacion}
cotizacion.dolar.timeout-ms=${COTIZACION_TIMEOUT_MS:5000}

# ==========================================
# FACTURACION FISCAL (ARCA/AFIP - WSFEv1, D13 Monotributo -> siempre Factura C)
# ==========================================
afip.cuit=${AFIP_CUIT:20300238379}
afip.punto-venta=${AFIP_PUNTO_VENTA:4}
# Certificado: en Railway/produccion, cargar el .key/.crt en base64 en estas dos variables. En
# desarrollo local alcanza con apuntar directo a los archivos reales (ver afip.cert.*-path), sin
# tener que basear64 a mano — nunca commitear ninguno de los dos archivos.
afip.cert.key-base64=${AFIP_CERT_KEY_BASE64:}
afip.cert.key-path=${AFIP_CERT_KEY_PATH:}
afip.cert.crt-base64=${AFIP_CERT_CRT_BASE64:}
afip.cert.crt-path=${AFIP_CERT_CRT_PATH:}

# Fotos, videos y audios de trabajos a domicilio. El tope por archivo lo marcan los videos (100 MB); las fotos
# tienen además su propio tope de 3 MB en FotoTrabajoService.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# ==========================================
# ADJUNTOS DE TRABAJOS: VIDEOS Y AUDIOS (Railway Storage Bucket, API S3 — ver S3AlmacenamientoArchivos)
# ==========================================
# Variables que Railway crea al conectar el bucket al servicio. OJO: el nombre para la API S3 es
# BUCKET, no RAILWAY_BUCKET_NAME (ese es solo el nombre visible). Sin estas variables el backend
# arranca igual y los videos y audios responden "no están configurados". Nunca commitear las claves.
archivos.almacenamiento=${ARCHIVOS_ALMACENAMIENTO:s3}
archivos.s3.bucket=${BUCKET:}
archivos.s3.endpoint=${ENDPOINT:https://t3.storageapi.dev}
archivos.s3.region=${REGION:auto}
archivos.s3.access-key-id=${ACCESS_KEY_ID:}
archivos.s3.secret-access-key=${SECRET_ACCESS_KEY:}
# Solo los buckets viejos de Railway usan path-style (lo dice la pestaña Credentials del bucket).
archivos.s3.path-style=${S3_PATH_STYLE:false}
